<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Mahasiswa</title>
</head>

<body>
    <h2>Form Pendaftaran Mahasiswa</h2>

    <form method="post" action="proses_pendaftaran.php">
        <label for="nim">NIM:</label>
        <input type="text" id="nim" name="nim"><br><br>

        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama"><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="tempat">Tempat, Tanggal Lahir:</label>
        <input type="text" id="tempat" name="tempat">
        <input type="date" id="ttl" name="ttl"><br><br>

        <label for="alamat">Alamat:</label>
        <input type="text" id="alamat" name="alamat"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Laki-Laki"> Laki-Laki
        <input type="radio" name="gender" value="Perempuan"> Perempuan <br><br>

        <input type="submit" value="Kirim">


    </form>
</body>
</html>
